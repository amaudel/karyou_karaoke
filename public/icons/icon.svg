<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#240c4a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#110726" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#070312" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep dark app background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Centered gradient emblem -->
  <g filter="url(#neonShadow)">
    <rect width="320" height="320" x="96" y="80" rx="72" fill="url(#brandGrad)"/>
    <rect width="316" height="316" x="98" y="82" rx="70" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- Microphone Icon & Sound Waves -->
  <g transform="translate(256, 226) scale(1.15)">
    <!-- Dynamic sound wave rings -->
    <path d="M -76 -36 A 84 84 0 0 0 -76 56" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 76 -36 A 84 84 0 0 1 76 56" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

    <!-- Mic Capsule -->
    <rect x="-32" y="-80" width="64" height="106" rx="32" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.3))"/>
    
    <!-- Capsule Details (grille) -->
    <line x1="-24" y1="-45" x2="24" y2="-45" stroke="#9333ea" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="-24" y1="-25" x2="24" y2="-25" stroke="#9333ea" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="-18" y1="-65" x2="18" y2="-65" stroke="#9333ea" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Mic Cradle / Arc -->
    <path d="M -48 -6 A 48 48 0 0 0 48 -6" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Mic Stand Stem -->
    <line x1="0" y1="42" x2="0" y2="80" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <!-- Mic Stand Base -->
    <line x1="-38" y1="80" x2="38" y2="80" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- KARYOU Branding Text -->
  <text x="256" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="6" fill="#f8fafc" text-anchor="middle">KARYOU</text>
</svg>
