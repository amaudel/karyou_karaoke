name: Install Karyou Blob SDK once
on:
  push:
    branches: [feat/karyou-bar-ads-v1-20261022]
    paths: [.github/workflows/install-karyou-blob-once.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/karyou-bar-ads-v1-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm add @vercel/blob@2.8.2 --save-exact
      - name: Commit dependency and lockfile
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "build(ads): instalar SDK Vercel Blob con lockfile"
          git push origin HEAD:feat/karyou-bar-ads-v1-20261022
