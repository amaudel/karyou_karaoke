name: Import Karyou TV images once
on:
  push:
    branches:
      - feat/tv-assets-propuesta2-20261021
    paths:
      - .github/workflows/import-karyou-assets-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/tv-assets-propuesta2-20261021
      - name: Download verified asset archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://at.adobe.com/cYIxEgEOl8YVTx9u' -o /tmp/karyou-assets.zip
          file /tmp/karyou-assets.zip
          unzip -t /tmp/karyou-assets.zip
          mkdir -p public/images/karyou
          unzip -oq /tmp/karyou-assets.zip -d .
          for name in trofeo-microfono escenario podio tarjeta-horizontal tarjeta-vertical confeti; do
            p="public/images/karyou/${name}.webp"
            test -s "$p"
            head -c 4 "$p" | grep -aq 'RIFF'
            echo "${name} $(stat -c%s "$p") bytes"
          done
      - name: Commit the six images to the pull request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/karyou/*.webp
          git diff --cached --quiet || git commit -m 'assets(tv): import six optimized Karyou images'
          git push origin HEAD:feat/tv-assets-propuesta2-20261021
